# imagewall 部署。放在 <部署根>/imagewall/docker-compose.yml，同目录：
#
#   cache/   缩略图缓存。可以整个删掉，会按需重新生成（受 IMG_CACHE_MAX_MB 限制）
#   state/   要长期保留的数据：图片尺寸 dims.json，以后还有颜色等。备份这个目录
#
# 首次部署：
#   mkdir -p cache state && chown 1000:1000 cache state   # 容器以 uid 1000 运行
#   docker compose pull && docker compose up -d
#
# 升级：docker compose pull && docker compose up -d
# 回退：把 image 改成 ghcr.io/sakurachiyo0v0/imagewall:1.2 这类具体版本，再 up -d
services:
  imagewall:
    image: ghcr.io/sakurachiyo0v0/imagewall:latest
    container_name: imagewall
    restart: unless-stopped
    # 用 bridge + 发布端口，不用 host 网络：
    # Kura 的服务清单是从 Docker 的「已发布端口」探测来的，host 网络的容器没有 Ports 字段，
    # 在 Kura 里就看不到这个服务。发布 8899 之后宿主、局域网、反代、Kura 都能访问。
    ports:
      - "8899:8899"
    mem_limit: 1200m
    environment:
      TZ: Asia/Shanghai
      IMG_DATA_ROOT: /data
      # 冒号分隔，都是 IMG_DATA_ROOT 下的目录
      IMG_ROOTS: "图片:漫画:素材"
      IMG_CACHE: /cache
      IMG_STATE: /state
      IMG_PORT: "8899"
      # IMG_CACHE_MAX_MB: "8192"
      # IMG_WORKERS: "4"
    volumes:
      # 图片只读：容器碰不到原图
      - /volume1:/data:ro
      - ./cache:/cache
      - ./state:/state
    networks:
      # Kura 的服务映射按容器名解析容器，kura-server 在 sso-net 上
      - sso-net
    labels:
      # 装了 watchtower 时：ghcr 上 :latest 一变就自动拉新的。没装时这个标签不起作用，手动 pull 即可
      - com.centurylinklabs.watchtower.enable=true

networks:
  sso-net:
    external: true
